[project]
name = "dinov2-leafcare"
version = "1.0.0"
description = "Plant disease classification on a fine-tuned DINOv2 ViT-B/14 backbone."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "pillow>=11.0.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.9.0",
    "scikit-learn>=1.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "httpx>=0.28.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "SIM",
    "PTH",
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
