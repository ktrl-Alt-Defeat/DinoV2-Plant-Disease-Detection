[project]
name = "dinov2-leafcare"
version = "0.1.0"
description = "DINOv2-S plant disease classification — engineering foundation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "PTH", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
