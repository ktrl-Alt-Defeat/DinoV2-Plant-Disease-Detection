[project]
name = "dinov2-leafcare"
version = "0.1.0"
description = "DINOv2-S plant disease classification."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",

    "torch",
    "torchvision",
    "torchaudio",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "SIM",
    "PTH",
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]