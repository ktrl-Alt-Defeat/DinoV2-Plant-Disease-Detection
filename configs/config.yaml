# DINOv2-S Plant Disease Classification — project configuration.
#
# The project, paths, device, logging, reproducibility and model sections are
# active. The remaining sections are reserved for later milestones and are
# intentionally left unpopulated.

project:
  name: "dinov2_s_plant_disease"
  version: "1.0.0"
  seed: 42

paths:
  logs: "logs"
  checkpoints: "checkpoints"
  results: "results"

device:
  preferred: "auto"

logging:
  level: "INFO"
  save_file: true

reproducibility:
  deterministic: true
  benchmark: false

model:
  # torch.hub entrypoint of the DINOv2 backbone. Swapping this value is the only
  # change needed to move to ViT-B/14, ViT-L/14 or ViT-G/14.
  name: "dinov2_vits14"
  pretrained: true
  freeze_backbone: false
  image_size: 224
  # Checked against the embedding width the backbone actually reports; the
  # backbone stays the source of truth.
  feature_dim: 384
  # Placeholder for architectural verification only. Milestone 4 replaces this
  # with the class count derived from the dataset metadata.
  num_classes: 10

classifier:
  type: "linear"
  dropout: 0.0

dataset: {}

training: {}

evaluation: {}
